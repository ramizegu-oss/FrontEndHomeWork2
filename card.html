<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Card</title>
        <link rel="stylesheet" href="CSS/card.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body>
        <header></header>
        <main>
            <section id="section1">
                <div class="main-div">
                    <div class="card">
                        <img src="Assets/image.webp" alt="card-picture">
                        <h2>Leslie Walton</h2>
                        <p class="p-info">Product Desinger, Kyiv</p>
                        <button class="plus">+</button>
                        <div class="card-part">
                            <p>17</p>
                            <p>143</p>
                            <p>57</p>
                        </div>
                        <div class="info">
                            <p>SHOTS</p>
                            <p>FLLOWING</p>
                            <p>FLLOWERS</p>
                        </div>
                        <div class="button-zone">
                            <button>Send message</button>
                            <p><a href="">MORE</a></p>
                            <i class="fa-sharp-duotone fa-solid fa-angle-down"></i>
                        </div>

                    </div>
                </div>
            </section>
        </main>
        <footer></footer>
    </body>
</html>
